ing-8 text-slate-700 dark:text-slate-300\",\"children\":\"Our previous pipeline runtime had the same problem many internal CI systems eventually hit: it did the right work, but in the wrong order. Too many jobs waited on coarse stage boundaries, cache reuse was inconsistent across branches, and monorepo changes triggered large parts of the graph that were technically unrelated.\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The new engine exists to make the pipeline behave more like the codebase actually behaves.\"}],\"\\n\",[\"$\",\"h2\",\"h2-1\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"We rebuilt the execution model around a dependency graph\"}],\"\\n\",[\"$\",\"p\",\"p-3\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Traditional stage-based CI is easy to reason about, but it becomes expensive in large repos. One slow job holds the entire stage open, and independent work sits idle.\"}],\"\\n\",[\"$\",\"p\",\"p-4\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The new engine constructs a graph of tasks based on declared inputs, outputs, affected packages, and environment contracts. That lets us release runnable work as soon as its real dependencies are satisfied instead of waiting for an arbitrary stage gate.\"}],\"\\n\",[\"$\",\"p\",\"p-5\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"In practice, that changed two important things:\"}],\"\\n\",[\"$\",\"ul\",\"ul-0\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Small changes stop paying the latency tax for unrelated systems\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Large changes saturate parallel capacity much more effectively\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",\"p-6\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This sounds obvious, but the operational challenge is making that graph trustworthy. We spent a lot of time on determinism, cache-key stability, and debuggability because a fast pipeline is useless if teams cannot explain why a job ran or skipped.\"}],\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\"],\"$L34\"]}]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"mt-12\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-6 flex items-center justify-between gap-4\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"p\",null,{\"className\":\"text-xs font-semibold uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400\",\"children\":\"Keep Reading\"}],[\"$\",\"h2\",null,{\"className\":\"mt-2 text-2xl font-semibold text-slate-900 dark:text-white\",\"children\":\"Related articles\"}]]}],[\"$\",\"$L7\",null,{\"href\":\"/blog\",\"className\":\"text-sm font-semibold text-indigo-600 hover:underline dark:text-indigo-400\",\"children\":\"View all posts\"}]]}],[\"$\",\"div\",null,{\"className\":\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\",\"children\":[[\"$\",\"$L7\",\"tweet-marketplace-update\",{\"href\":\"/blog/tweet-marketplace-update\",\"className\":\"group block overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700/60 dark:bg-[#212121]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative h-48\",\"children\":[[\"$\",\"$L1a\",null,{\"src\":\"https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format\u0026fit=crop\u0026fm=jpg\u0026ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fHRlYW0lMjBtZWV0aW5nfGVufDB8fDB8fHww\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"A team planning around a whiteboard during a product session.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 33vw\",\"className\":\"object-cover transition-transform duration-700 group-hover:scale-105\"}],[\"$\",\"div\",null,{\"className\":\"absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"absolute bottom-0 left-0 right-0 p-4\",\"children\":[\"$\",\"span\",null,{\"className\":\"rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-900\",\"children\":\"Product\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"space-y-3 p-5\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-xl font-semibold leading-snug text-slate-900 transition-colors group-hover:text-indigo-600 dark:text-white dark:group-hover:text-indigo-400\",\"children\":\"New in Marketplace: 1-click deploy for RAGFlow, Temporal IO, and Suricata IDS. All with auto-scaling and managed backups.\"}],[\"$\",\"p\",null,{\"className\":\"text-sm leading-6 text-slate-600 dark:text-slate-300\",\"children\":\"This is the longer product story behind the launch: how we package complex apps, what day-two operations are bundled, and why these three workloads were added together.\"}],[\"$\",\"p\",null,{\"className\":\"text-xs text-slate-500 dark:text-slate-400\",\"children\":[\"Feb 22, 2026\",\" / \",\"7 min read\"]}]]}]]}],[\"$\",\"$L7\",\"deploy-kubernetes-production\",{\"href\":\"/blog/deploy-kubernetes-production\",\"className\":\"group block overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700/60 dark:bg-[#212121]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative h-48\",\"children\":[[\"$\",\"$L1a\",null,{\"src\":\"https://images.unsplash.com/photo-1695668548342-c0c1ad479aee?auto=format\u0026fit=crop\u0026fm=jpg\u0026ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8c2VydmVyJTIwcm9vbXxlbnwwfHwwfHx8MA%3D%3D\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"Rows of servers inside a production data center rack.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 33vw\",\"className\":\"object-cover transition-transform duration-700 group-hover:scale-105\"}],[\"$\",\"div\",null,{\"className\":\"absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"absolute bottom-0 left-0 right-0 p-4\",\"children\":[\"$\",\"span\",null,{\"className\":\"rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-900\",\"children\":\"DevOps\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"space-y-3 p-5\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-xl font-semibold leading-snug text-slate-900 transition-colors group-hover:text-indigo-600 dark:text-white dark:group-hover:text-indigo-400\",\"children\":\"How We Scaled Kubernetes to 10,000 Pods in Production\"}],\"$L35\",\"$L36\"]}]]}],\"$L37\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"h2\",\"h2-2\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Cache hits improved because the cache finally reflected reality\"}]\n1d:[\"$\",\"p\",\"p-7\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Our old caching story mostly depended on branch-level conventions and Docker layer reuse. That helped, but it also created two common failure modes: false misses on nearly identical work and stale hits on tasks whose real inputs were not tracked carefully.\"}]\n1e:[\"$\",\"p\",\"p-8\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We tightened cache keys around:\"}]\n1f:[\"$\",\"ul\",\"ul-1\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Source files and lockfiles\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Build configuration and environment contracts\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Container build context\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Toolchain versions and target platform\"}],\"\\n\"]}]\n20:[\"$\",\"p\",\"p-9\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We also made the cache visible. Engineers can now see why a task hit or missed, which is critical for trust. Hidden caching feels magical until it costs someone an hour.\"}]\n21:[\"$\",\"h2\",\"h2-3\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Regional execution was about latency and resilience, not just speed\"}]\n22:[\"$\",\"p\",\"p-10\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We run teams and workloads across regions, so our CI system now schedules execution closer to the artifacts, registries, and test environments each workflow depends on.\"}]\n23:[\"$\",\"p\",\"p-11\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That matters in three places:\"}]\n24:[\"$\",\"ul\",\"ul-2\",{\"className\":\"mt-5 l"])</script><script>self.__next_f.push([1,"ist-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Pulling large dependencies\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Running integration tests against regional services\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Publishing artifacts back into the deployment path\"}],\"\\n\"]}]\n25:[\"$\",\"p\",\"p-12\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The engine can dispatch work to the region that minimizes round trips while still respecting policy and capacity. We also built fallback logic so a regional issue degrades performance before it breaks developer delivery.\"}]\n26:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Rollback had to be first-class or the launch would not be credible\"}]\n27:[\"$\",\"p\",\"p-13\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"A fast pipeline is only valuable if it keeps release behavior safe. We tied deployment actions to health checks, progressive rollout policies, and automatic rollback hooks so that failure paths were part of the normal runtime, not an afterthought.\"}]\n28:[\"$\",\"p\",\"p-14\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That gave teams a better default posture:\"}]\n29:[\"$\",\"ul\",\"ul-3\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Faster green-path delivery\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Smaller blast radius when a deployment regresses\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Clearer audit trail when the system rolls something back on its own\"}],\"\\n\"]}]\n2a:[\"$\",\"p\",\"p-15\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Speed without rollback discipline just moves the incident earlier in the day.\"}]\n2b:[\"$\",\"h2\",\"h2-5\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-90"])</script><script>self.__next_f.push([1,"0 dark:text-white\",\"children\":\"What changed for developers using it\"}]\n2c:[\"$\",\"p\",\"p-16\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"From a product perspective, the goal was not to make users learn a new mental model. The ideal outcome was that teams keep describing pipelines the way they already do, but the engine executes them more intelligently underneath.\"}]\n2d:[\"$\",\"p\",\"p-17\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The developer-visible improvements are:\"}]\n2e:[\"$\",\"ul\",\"ul-4\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Shorter feedback loops on PRs\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Fewer full-repo rebuilds on narrow changes\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Better insight into cache behavior and execution order\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Clearer run logs when parallel branches fan out\"}],\"\\n\"]}]\n2f:[\"$\",\"p\",\"p-18\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The best infrastructure products make the advanced parts feel invisible until you need to inspect them.\"}]\n30:[\"$\",\"h2\",\"h2-6\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Why this matters beyond one feature launch\"}]\n31:[\"$\",\"p\",\"p-19\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Delivery systems quietly shape engineering behavior. If builds are slow, teams batch changes. If rollouts are unpredictable, teams deploy less often. If CI feels arbitrary, developers stop trusting the results and start adding manual checks around it.\"}]\n32:[\"$\",\"p\",\"p-20\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That is why we invested here. Faster builds are nice. More frequent, lower-risk shipping is the real outcome we wanted.\"}]\n33:[\"$\",\"p\",\"p-21\",{\"className\":\"mt-5 text-base lead"])</script><script>self.__next_f.push([1,"ing-8 text-slate-700 dark:text-slate-300\",\"children\":\"This launch is the first step, not the last one. We are already working on richer affected-target analysis, workload-aware queueing, and stronger deployment policy controls. But the foundation is finally in place: the pipeline now understands enough about the work to stop treating every change like the same change.\"}]\n"])</script><script>self.__next_f.push([1,"34:[\"$\",\"div\",null,{\"className\":\"mt-12 border-t border-slate-200 pt-6 dark:border-slate-700\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2\",\"children\":[[\"$\",\"span\",\"CI/CD\",{\"className\":\"rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:border-slate-700 dark:text-slate-400\",\"children\":\"CI/CD\"}],[\"$\",\"span\",\"Launch\",{\"className\":\"rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:border-slate-700 dark:text-slate-400\",\"children\":\"Launch\"}],[\"$\",\"span\",\"Product\",{\"className\":\"rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:border-slate-700 dark:text-slate-400\",\"children\":\"Product\"}]]}]}]\n"])</script><script>self.__next_f.push([1,"35:[\"$\",\"p\",null,{\"className\":\"text-sm leading-6 text-slate-600 dark:text-slate-300\",\"children\":\"A detailed look at how we evolved our cluster topology, scheduling strategy, and observability stack to handle multi-region growth without losing cost discipline.\"}]\n36:[\"$\",\"p\",null,{\"className\":\"text-xs text-slate-500 dark:text-slate-400\",\"children\":[\"Mar 12, 2026\",\" / \",\"12 min read\"]}]\n"])</script><script>self.__next_f.push([1,"37:[\"$\",\"$L7\",\"ai-agents-infrastructure\",{\"href\"
