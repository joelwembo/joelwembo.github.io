al question. If a plan touches networking, compute, database policy, and application secrets all at once, the stack is already too broad.\"}],\"\\n\",[\"$\",\"h2\",\"h2-1\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"State layout is a product decision\"}],\"\\n\",[\"$\",\"p\",\"p-3\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Remote state is table stakes. The more important question is how many states you maintain and where you draw the lines between them.\"}],\"\\n\",[\"$\",\"p\",\"p-4\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We split state by lifecycle and blast radius:\"}],\"\\n\",[\"$\",\"ul\",\"ul-0\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Foundation state for shared primitives like networking, identity, and DNS\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Platform state for reusable capabilities such as clusters, registries, and observability\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Service or application state for workload-specific resources\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",\"p-5\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That separation buys you more than safety. It also creates cleaner review conversations. A VPC change should not arrive in the same plan as an application autoscaling tweak unless there is a very strong reason.\"}],\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\ p\",\"p-9\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"If a reviewer cannot tell what a module is doing without opening five files, the abstraction is already too expensive.\"}]\n20:[\"$\",\"h2\",\"h2-3\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Provider upgrades deserve their own operating lane\"}]\n21:[\"$\",\"p\",\"p-10\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Multi-cloud setups fail quietly when provider versions drift. Teams pin different versions, new defaults appear, and seemingly harmless upgrades produce plan churn that obscures real risk.\"}]\n22:[\"$\",\"p\",\"p-11\",{\"className\":\"mt-5 text-base leading-8 text-"])</script><script>self.__next_f.push([1,"slate-700 dark:text-slate-300\",\"children\":\"We now treat provider upgrades as intentional work:\"}]\n23:[\"$\",\"ol\",\"ol-0\",{\"className\":\"mt-5 list-decimal space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Pin versions explicitly at the root\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Run upgrade branches that exist only to absorb provider changes\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Review plans for behavior changes, not just syntax compatibility\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Merge provider updates independently from infrastructure feature work\"}],\"\\n\"]}]\n24:[\"$\",\"p\",\"p-12\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This keeps upgrade noise from leaking into unrelated pull requests and makes rollback decisions much cleaner when a provider release behaves unexpectedly.\"}]\n25:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Policy should block bad patterns befo
