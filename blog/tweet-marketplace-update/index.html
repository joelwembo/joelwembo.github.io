\":\"Monitoring exists before the first problem\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Updates do not require relearning the underlying stack\"}],\"\\n\"]}]\n27:[\"$\",\"p\",\"p-12\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That framing changes how we build marketplace releases. We are not publishing manifests. We are publishing an operating envelope.\"}]\n28:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"The internal quality bar is \\\"fewer surprise responsibilities\\\"\"}]\n29:[\"$\",\"p\",\"p-13\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"When a team clicks deploy, they should not discover hidden responsibilities after the fact. If a workload needs special storage classes, unusual ingress handling, or non-obvious secret rotation steps, that needs to be encoded or clearly surfaced up front.\"}]\n2a:[\"$\",\"p\",\"p-14\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The best marketplace experience reduces surprise responsibilities:\"}]\n2b:[\"$\",\"ul\",\"ul-2\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Clear prerequisites\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Clear resource expectations\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Clear ownership boundaries between customer and platform\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Clear support path when something deviates from "])</script><script>self.__next_f.push([1,"the norm\"}],\"\\n\"]}]\n2c:[\"$\",\"p\",\"p-15\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"If we cannot explain those pieces cleanly, the app is not ready no matter how impressive the logo looks in the cat
