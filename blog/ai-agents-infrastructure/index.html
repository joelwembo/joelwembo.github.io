8MHxzZWFyY2h8Nnx8YXJ0aWZpY2lhbCUyMGludGVsbGlnZW5jZSUyMGFuZCUyMG1hY2hpbmUlMjBsZWFybmluZ3xlbnwwfHwwfHx8MA%3D%3D\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"An abstract computer display with text and light effects suggesting AI automation.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 1200px\",\"className\":\"object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap items-center justify-between gap-3 bg-slate-950 px-5 py-3 text-xs text-slate-200\",\"children\":[[\"$\",\"p\",null,{\"children\":\"An abstract computer display with text and light effects suggesting AI automation.\"}],[\"$\",\"a\",null,{\"href\":\"https://unsplash.com/s/photos/artificial-intelligence-and-machine-learning\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"font-medium text-slate-100 underline-offset-4 hover:underline\",\"children\":[\"Photo: \",\"Jonathan Kemper / Unsplash\"]}]]}]]}],[\"$\",\"$L1a\",null,{\"likes\":567,\"comments\":89,\"title\":\"Building AI Agents That Manage Your Cloud Infrastructure\"}],[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-3xl\",\"children\":[[[\"$\",\"h2\",\"h2-0\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"We did not start by letting agents touch production\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Most discussions about AI agents in infrastructure skip the operational truth: trust is the hard part. Not model selection. Not prompt engineering. Trust.\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Operators do not care that a system can describe a root cause elegantly. They care whether it can make the right call at 2:13 AM when metrics are noisy, alerts are flapping, and three unrelated changes landed in the previous hour.\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"So our first version of an infrastructure agent did not remediate anything. It observed. It summarized. It attached context to alerts. It assembled timelines. It made humans faster before it was allowed to make machines act.\"}],\"\\n\",[\"$\",\"p\",\"p-3\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That decision slowed our demo velocity and sped up our learning.\"}],\"\\n\",[\"$\",\"h2\",\"h2-1\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"The architecture is a control loop, not a chatbot\"}],\"\\n\",[\"$\",\"p\",\"p-4\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The interface can look conversational, but the implementation cannot behave like a casual assistant. For production infrastructure, an agent has to function as a structured control loop:\"}],\"\\n\",[\"$\",\"ol\",\"ol-0\",{\"className\":\"mt-5 list-decimal space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Collect signals from metrics, logs, traces, deployments, and config state\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Build a narrow, time-bounded incident context\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Generate one or more hypotheses with confidence scores\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Match those hypotheses to approved playbooks\"}],\"\\n\",[\"$\",\"li\",\"li-4\",{\"children\":\"Either execute within policy or escalate with a clear recommendation\"}],\"\\n\"]}],\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\"],\"$L37\"]}]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"mt-12\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-6 flex items-center justify-between gap-4\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"p\",null,{\"className\":\"text-xs font-semibold uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400\",\"children\":\"Keep Reading\"}],[\"$\",\"h2\",null,{\"className\":\"mt-2 text-2xl font-semibold text-slate-900 dark:text-white\",\"children\":\"Related articles\"}]]}],[\"$\",\"$L7\",null,{\"href\":\"/blog\",\"className\":\"text-sm font-semibold text-indigo-600 hover:underline dark:text-indigo-400\",\"children\":\"View all posts\"}]]}],[\"$\",\"div\",null,{\"className\":\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\",\"children\":[[\"$\",\"$L7\",\"tweet-cost-optimization\",{\"href\":\"/blog/tweet-cost-optimization\",\"className\":\"group block overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700/60 dark:bg-[#212121]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative h-48\",\"children\":[[\"$\",\"$L14\",null,{\"src\":\"https://images.unsplash.com/photo-1639762681485-074b7f938ba0?auto=format\u0026fit=crop\u0026fm=jpg\u0026ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D\u0026ixlib=rb-4.1.0\u0026q=80\u0026w=3000\",\"alt\":\"AI and machine learning visualization with neural network patterns and data analytics.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 33vw\",\"className\":\"object-cover transition-transform duration-700 group-hover:scale-105\"}],[\"$\",\"div\",null,{\"className\":\"absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"absolute bottom-0 left-0 right-0 p-4\",\"children\":[\"$\",\"span\",null,{\"className\":\"rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-900\",\"children\":\"AI \u0026 ML\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"space-y-3 p-5\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-xl font-semibold leading-snug text-slate-900 transition-colors group-hover:text-indigo-600 dark:text-white dark:group-hover:text-indigo-400\",\"children\":\"Our AI cost optimization agent just identified $127K in annual savings for a customer by right-sizing their EC2 instances and switching to Graviton.\"}],[\"$\",\"p\",null,{\"className\":\"text-sm leading-6 text-slate-600 dark:text-slate-300\",\"children\":\"The savings number got attention. The harder part was building a recommendation system that operations teams would actually trust enough to apply.\"}],[\"$\",\"p\",null,{\"className\":\"text-xs text-slate-500 dark:text-slate-400\",\"children\":[\"Feb 28, 2026\",\" / \",\"7 min read\"]}]]}]]}],[\"$\",\"$L7\",\"deploy-kubernetes-production\",{\"href\":\"/blog/deploy-kubernetes-production\",\"className\":\"group block overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700/60 dark:bg-[#212121]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative h-48\",\"children\":[[\"$\",\"$L14\",null,{\"src\":\"https://images.unsplash.com/photo-1695668548342-c0c1ad479aee?auto=format\u0026fit=crop\u0026fm=jpg\u0026ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8c2VydmVyJTIwcm9vbXxlbnwwfHwwfHx8MA%3D%3D\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"Rows of servers inside a production data center rack.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 33vw\",\"className\":\"object-cover transition-transform duration-700 group-hover:scale-105\"}],[\"$\",\"div\",null,{\"className\":\"absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"absolute bottom-0 left-0 right-0 p-4\",\"children\":[\"$\",\"span\",null,{\"className\":\"rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-900\",\"children\":\"DevOps\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"space-y-3 p-5\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-xl font-semibold leading-snug text-slate-900 transition-colors group-hover:text-indigo-600 dark:text-white dark:group-hover:text-indigo-400\",\"children\":\"How We Scaled Kubernetes to 10,000 Pods in Production\"}],\"$L38\",\"$L39\"]}]]}],\"$L3a\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"p\",\"p-5\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That framing changed a lot of design decisions. We stopped asking, \\\"Can the model answer this?\\\" and started asking, \\\"What evidence would justify taking an action?\\\"\"}]\n1c:[\"$\",\"p\",\"p-6\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The evidence requirement forced us to model uncertainty explicitly. That was good for safety and good for product quality.\"}]\n1d:[\"$\",\"h2\",\"h2-2\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Most incidents are not diagnosis failures. They are context failures\"}]\n1e:[\"$\",\"p\",\"p-7\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Human responders are usually capable of solving the problem. What slows them down is the time required to collect the right clues. Which deployment happened? Which services degraded first? Is this isolated to one cluster, one zone, one customer segment, or one dependency?\"}]\n1f:[\"$\",\"p\",\"p-8\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Agents add value when they compress that context fast and consistently.\"}]\n20:[\"$\",\"p\",\"p-9\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We had the best results when the agent could answer questions like:\"}]\n21:[\"$\",\"ul\",\"ul-0\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"What changed in the thirty minutes before the alert?\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Which downstream services show correlated failure patterns?\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Is this symptom historically associated with memory pressure, config drift, or dependency latency?\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"What did we do the last three times a similar signature appeared?\"}],\"\\n\"]}]\n22:[\"$\",\"p\",\"p-10\",{\"className\":\"mt-5 tex"])</script><script>self.__next_f.push([1,"t-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Those are not magical questions. They are exactly the questions strong responders already ask. The point of the agent is to ask them instantly and in the same order every time.\"}]\n23:[\"$\",\"h2\",\"h2-3\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Guardrails mattered more than model intelligence\"}]\n24:[\"$\",\"p\",\"p-11\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We treat infrastructure agents as bounded operators, not autonomous geniuses. Every action path is constrained by policy, scope, and rollback availability.\"}]\n25:[\"$\",\"p\",\"p-12\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Our guardrails include:\"}]\n"])</script><script>self.__next_f.push([1,"26:[\"$\",\"ul\",\"ul-1\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Environment scoping so lower environments absorb most experimentation\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Per-playbook approval modes ranging from observe-only to fully automatic\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Mandatory rollback definitions before a playbook can execute unattended\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Rate limits so the system cannot spam the same remediation across a fleet\"}],\"\\n\",[\"$\",\"li\",\"li-4\",{\"children\":\"Confidence thresholds that trigger human approval instead of action\"}],\"\\n\"]}]\n"])</script><script>self.__next_f.push([1,"27:[\"$\",\"p\",\"p-13\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This structure made the system feel more boring, which is exactly what we wanted. Boring is a feature in operations.\"}]\n28:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Playbooks are where product quality actually shows up\"}]\n29:[\"$\",\"p\",\"p-14\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The model is only one part of the system. The real quality bar sits in the playbooks and the data contract around them.\"}]\n2a:[\"$\",\"p\",\"p-15\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"A useful remediation playbook needs:\"}]\n2b:[\"$\",\"ul\",\"ul-2\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Preconditions that make it safe to run\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Observable signals that confirm whether it worked\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Side-effect boundaries so operators know what might be disrupted\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Rollback steps that are clear enough to automate or delegate quickly\"}],\"\\n\"]}]\n2c:[\"$\",\"p\",\"p-16\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"For example, \\\"restart the pods\\\" is not a playbook. \\\"Drain one replica at a time, observe queue depth and error rate, abort if latency exceeds threshold, and annotate the incident timeline\\\" is a playbook.\"}]\n2d:[\"$\",\"p\",\"p-17\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Once we built playbooks that way, the agent stopped feeling like a clever assistant and started feeling like an operational system.\"}]\n2e:[\"$\",\"h2\",\"h2-5\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"We learned to optimize for operator confidence, not autonomy percentage\"}]\n"])</script><script>self.__next_f.push([1,"2f:[\"$\",\"p\",\"p-18\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"It is tempting to measure success by the percentage of incidents the agent closes without a human. That metric can be useful, but it can also hide bad product behavior. A system that auto-resolves only trivial issues while confusing responders on hard incidents is not actually helping.\"}]\n30:[\"$\",\"p\",\"p-19\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The metrics we care about now are:\"}]\n31:[\"$\",\"ul\",\"ul-3\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Mean time to context: how fast the agent assembles a usable incident story\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Mean time to safe action: how quickly it proposes or executes the first sensible step\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"False-confidence rate: how often it sounds certain while evidence is weak\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Rollback quality: how often operators can recover quickly if an action does not help\"}],\"\\n\"]}]\n32:[\"$\",\"p\",\"p-20\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"These measures pushed us toward clarity, evidence, and restraint.\"}]\n33:[\"$\",\"h2\",\"h2-6\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Infrastructure agents are best when they reduce cognitive load\"}]\n34:[\"$\",\"p\",\"p-21\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The future is not a single agent silently running the cloud. The practical future is a layered operating model where agents handle evidence gathering, routine corrective actions, cost analysis, and repetitive review work while humans stay responsible for policy, architecture, and edge cases.\"}]\n35:[\"$\",\"p\",\"p-22\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That division of labor is "])</script><script>self.__next_f.push([1,"already useful today.\"}]\n36:[\"$\",\"p\",\"p-23\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"If you are building agents for operations, start with the work that engineers are tired of repeating but still know how to verify. Build the evidence model before the action layer. Treat confidence as a product feature. And remember that an agent earns trust one clean handoff at a time.\"}]\n"])</script><script>self.__next_f.push([1,"37:[\"$\",\"div\",null,{\"className\":\"mt-12 border-t border-slate-200 pt-6 dark:border-slate-700\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2\",\"children\":[[\"$\",\"span\",\"AI\",{\"className\":\"rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold uppercase tra
