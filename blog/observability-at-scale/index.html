NHx8bGFwdG9wJTIwZGFzaGJvYXJkfGVufDB8fDB8fHww\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"A dark monitoring dashboard displayed on a laptop.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 1200px\",\"className\":\"object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap items-center justify-between gap-3 bg-slate-950 px-5 py-3 text-xs text-slate-200\",\"children\":[[\"$\",\"p\",null,{\"children\":\"A dark monitoring dashboard displayed on a laptop.\"}],[\"$\",\"a\",null,{\"href\":\"https://unsplash.com/s/photos/laptop-dashboard\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"font-medium text-slate-100 underline-offset-4 hover:underline\",\"children\":[\"Photo: \",\"Neil Fernandez / Unsplash\"]}]]}]]}],[\"$\",\"$L1a\",null,{\"likes\":312,\"comments\":55,\"title\":\"Building an Observability Platform That Doesn't Break the Bank\"}],[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-3xl\",\"children\":[[[\"$\",\"h2\",\"h2-0\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Observability cost becomes an architecture problem surprisingly fast\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"When teams complain that observability is expensive, they are usually reacting to a bill. The underlying issue is architectural. If you collect every signal at full fidelity, retain it all in the same expensive tier, and query it through one premium path, cost growth becomes inevitable.\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The challenge is to reduce cost without making the platform so fragile that engineers stop trusting it.\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That balance guided every major design decision in our stack.\"}],\"\\n\",[\"$\",\"h2\",\"h2-1\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"We designed around different lifecycles for metrics, logs, and traces\"}],\"\\n\",[\"$\",\"p\",\"p-3\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The easiest way to overspend is to treat all telemetry as if it has the same value profile. It does not.\"}],\"\\n\",[\"$\",\"p\",\"p-4\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Metrics support dashboards, alerting, and trend analysis. Traces are invaluable for understanding request behavior but are often most useful for narrower windows. Logs range from critical audit and incident evidence to low-value noise generated by verbose defaults.\"}],\"\\n\",[\"$\",\"p\",\"p-5\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Once we acknowledged those differences, the storage model became clearer:\"}],\"\\n\",[\"$\",\"ul\",\"ul-0\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Keep high-value, fast-access data in shorter hot windows\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Tier older or lower-value data into cheaper object storage\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Sample or downscope signals whose marginal value is low\"}],\"\\n\"]}],\"\\n\",[\"$\",\"p\",\"p-6\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This made the platform economically defensible without turning it into a black box.\"}],\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\"],\"$L37\"]}]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"mt-12\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-6 flex items-center justify-between gap-4\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"p\",null,{\"className\":\"text-xs font-semibold uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400\",\"children\":\"Keep Reading\"}],[\"$\",\"h2\",null,{\"className\":\"mt-2 text-2xl font-semibold text-slate-900 dark:text-white\",\"children\":\"Related articles\"}]]}],[\"$\",\"$L7\",null,{\"href\":\"/blog\",\"className\":\"text-sm font-semibold text-indigo-600 hover:underline dark:text-indigo-400\",\"children\":\"View all posts\"}]]}],[\"$\",\"div\",null,{\"className\":\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\",\"children\":[[\"$\",\"$L7\",\"zero-downtime-migrations\",{\"href\":\"/blog/zero-downtime-migrations\",\"className\":\"group block overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700/60 dark:bg-[#212121]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative h-48\",\"children\":[[\"$\",\"$L14\",null,{\"src\":\"https://images.unsplash.com/photo-1580106815433-a5b1d1d53d85?auto=format\u0026fit=crop\u0026fm=jpg\u0026ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8c2VydmVyJTIwcm9vbXxlbnwwfHwwfHx8MA%3D%3D\u0026ixlib=rb-4.1.0\u0026q=60\u0026w=3000\",\"alt\":\"A modern hallway inside a technical facility, representing safe transitions.\",\"fill\":true,\"sizes\":\"(max-width: 768px) 100vw, 33vw\",\"className\":\"object-cover transition-transform duration-700 group-hover:scale-105\"}],[\"$\",\"div\",null,{\"className\":\"absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-trans om-black/70 via-black/10 to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"absolute bottom-0 left-0 right-0 p-4\",\"children\":[\"$\",\"span\",null,{\"className\":\"rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-900\",\"children\":\"Engineering\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"space-y-3 p-5\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-xl font-semibold leading-snug text-slate-900 transition-colors group-hover:text-indigo-600 dark:text-white dark:group-hover:text-indigo-400\",\"children\":\"Securing the Kubernetes Software Supply Chain\"}],\"$L38\",\"$L39\"]}]]}],\"$L3a\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"h2\",\"h2-2\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Collection architecture mattered more than backend selection\"}]\n1c:[\"$\",\"p\",\"p-7\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"OpenTelemetry gave us a consistent instrumentation story, but the real leverage came from how we shaped traffic before it hit storage.\"}]\n1d:[\"$\",\"p\",\"p-8\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We leaned on collectors to:\"}]\n1e:[\"$\",\"ul\",\"ul-1\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Normalize metadata early\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Drop or reduce low-value spans and logs\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Route signals to the right storage path\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Apply policy consistently across languages and runtimes\"}],\"\\n\"]}]\n1f:[\"$\",\"p\",\"p-9\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This helped keep the backends cleaner and made it easier to evolve the system over time. It also created a useful operational choke point for debugging telemetry quality.\"}]\n20:[\"$\",\"h2\",\"h2-3\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Sampling only works when you are honest about what you need\"}]\n21:[\"$\",\"p\",\"p-10\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Teams often resist sampling because they imagine a future incident where the missing trace would have solved everything. That concern is understandable. It is also incomplete.\"}]\n22:[\"$\",\"p\",\"p-11\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The better question is which data must be preserved at high fidelity and which data can be represented statistically without harming decision quality.\"}]\n23:[\"$\",\"p\",\"p-12\",{\"cl"])</script><script>self.__next_f.push([1,"assName\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Our posture is:\"}]\n24:[\"$\",\"ul\",\"ul-2\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Keep errors and rare failure paths at high fidelity\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Keep service-level latency signals intact\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Sample healthy, repetitive success traffic aggressively where appropriate\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Preserve raw depth temporarily during major incidents or launches\"}],\"\\n\"]}]\n25:[\"$\",\"p\",\"p-13\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This lets us spend detail where it matters instead of paying premium rates for endless healthy traffic that nobody will inspect.\"}]\n26:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Unified correlation mattered more than a fancy UI\"}]\n27:[\"$\",\"p\",\"p-14\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Engineers do not want three beautiful tools that cannot explain the same event together. They want a reliable way to move from alert to service to trace to log line without losing context.\"}]\n28:[\"$\",\"p\",\"p-15\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We invested heavily in consistent metadata, trace IDs in logs, service naming discipline, and dashboard conventions. Those moves sound less exciting than choosing a backend, but they are what make the platform feel coherent to the people using it.\"}]\n29:[\"$\",\"p\",\"p-16\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Correlation is the real user experience of observability.\"}]\n2a:[\"$\",\"h2\",\"h2-5\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Platform ownership had to stay realistic\"}]\n2b:[\"$\",\"p\",\"p-17\",{\""])</script><script>self.__next_f.push([1,"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"An open-source observability stack only pays off if the organization can actually operate it. We kept the design intentionally conservative:\"}]\n2c:[\"$\",\"ul\",\"ul-3\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Fewer moving parts where possible\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Strong defaults for dashboards and alerts\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Object storage for retention instead of forcing everything into expensive hot systems\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Clear SLOs for the observability platform itself\"}],\"\\n\"]}]\n2d:[\"$\",\"p\",\"p-18\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That last point matters. If your monitoring platform is unreliable, teams overcompensate with duplicate tooling, manual exports, or over-retention. Reliability discipline is part of cost control.\"}]\n2e:[\"$\",\"h2\",\"h2-6\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Cost control became easier once teams could see telemetry economics\"}]\n2f:[\"$\",\"p\",\"p-19\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We started exposing simple usage views by team and service:\"}]\n30:[\"$\",\"ul\",\"ul-4\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Top log producers\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Most expensive trace emitters\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Services with unusually high-cardinality labels\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Retention tier consumption over time\"}],\"\\n\"]}]\n31:[\"$\",\"p\",\"p-20\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That visibility changed behavior quickly. Teams removed noisy debug logs, normalized labels, and thought harder about w"])</script><script>self.__next_f.push([1,"hat they emitted because the economics were finally visible.\"}]\n32:[\"$\",\"h2\",\"h2-7\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Cheap observability is not the goal. Sustainable observability is.\"}]\n33:[\"$\",\"p\",\"p-21\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The success condition is not merely paying less than a commercial ve
