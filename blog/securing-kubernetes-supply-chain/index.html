1f:[\"$\",\"p\",\"p-9\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Many organizations have solid security standards written down somewhere. Fewer have those standards encoded where deployment can actually be blocked.\"}]\n20:[\"$\",\"p\",\"p-10\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Admission policy is the bridge between intention and enforcement. It lets you require things such as:\"}]\n21:[\"$\",\"ul\",\"ul-2\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Signed images from approved registries\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Resource policies that prevent obviously unsafe defaults\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"No"])</script><script>self.__next_f.push([1,"n-root execution and stronger container security contexts\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Mandatory labels, ownership metadata, and approved namespaces\"}],\"\\n\"]}]\n22:[\"$\",\"p\",\"p-11\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"This is one of the highest-leverage moves in cluster security because it shifts the system from \\\"we usually do this\\\" to \\\"the platform refuses not to.\\\"\"}]\n23:[\"$\",\"h2\",\"h2-4\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Runtime matters because build-time controls are not the end of the story\"}]\n24:[\"$\",\"p\",\"p-12\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Even a well-governed artifact can behave badly at runtime. Credentials can be abused. A vulnerable application can still be exploited. Unexpected outbound traffic can still show up after deployment.\"}]\n25:[\"$\",\"p\",\"p-13\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"That is why runtime monitoring remains essential. We focus on signals that are explainable and actionable:\"}]\n26:[\"$\",\"ul\",\"ul-3\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Shell execution inside containers that should never be interactive\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Sensitive file access patterns\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Suspicious process trees\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Unusual egress behavior\"}],\"\\n\"]}]\n27:[\"$\",\"p\",\"p-14\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"The goal is not to detect every possible attack perfectly. The goal is to detect the kinds of deviations that tell you a trusted workload might no longer be behaving like a trusted workload.\"}]\n28:[\"$\",\"h2\",\"h2-5\",{\"className\":\"mt-12 text-2xl font-semibold leading-tight text-slate-900 dark:text-white\",\"children\":\"Secrets management is often the we"])</script><script>self.__next_f.push([1,"akest practical link\"}]\n29:[\"$\",\"p\",\"p-15\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"Teams can get image signing right and still sabotage themselves with weak secret handling. Storing plain secrets in CI, over-sharing runtime credentials, or mounting broad permissions into pods undoes a lot of security work.\"}]\n2a:[\"$\",\"p\",\"p-16\",{\"className\":\"mt-5 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":\"We push hard on a few simple standards:\"}]\n2b:[\"$\",\"ul\",\"ul-4\",{\"className\":\"mt-5 list-disc space-y-2 pl-6 text-base leading-8 text-slate-700 dark:text-slate-300\",\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":\"Secrets come from managed systems, not from repository files\"}]
